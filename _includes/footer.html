<footer class="relative px-4 pt-4 pb-4">
  
  <!-- divider -->
  <div class="relative my-8">
    <div class="absolute inset-0 flex items-center" aria-hidden="true">
      <div class="w-full border-t border-gray-200"></div>
    </div>
    <div class="relative flex justify-center ">
      <span class="bg-white px-2 text-gray-200">
        <i class="text-xs far fa-square"></i>
      </span>
    </div>
  </div>

  <!-- footer msg -->
  <div class="flex flex-wrap items-center justify-center">
    <div class="text-sm text-gray-300">
      © <span id="get-current-year"></span>
      {% if site.footer-msg %}
      <a href="{{site.footer-msg-link}}" class="!no-underline">
        {{site.footer-msg}}
      </a>
      {% endif %}
    </div>
  </div>

  <!-- improve this page -->
  {% if site.commit_hash and page.path %}
  <div class="flex flex-wrap items-center justify-center mt-2">
    <div class="text-sm text-gray-300">
      Improve this page @
      <a href="https://github.com/AumitLeon/aumitleon.github.io/tree/{{ site.commit_hash }}/{{ page.path }}" class="commit-hash">{{ site.commit_hash | slice: 0, 7 }}</a>
    </div>
  </div>
  {% endif %}

  <!-- nix store path (present only on the Nix build) -->
  {% if site.nix_store_path %}
  <div class="flex flex-wrap items-center justify-center mt-2">
    <code class="store-path text-gray-300 text-center" title="This site was built by Nix">{{ site.nix_store_path }}</code>
  </div>
  {% endif %}
  </div>
</footer>
