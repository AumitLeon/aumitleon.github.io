name: Deploy to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress production run.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build the site with Nix. The flake pins Ruby/Jekyll (via gemset.nix) and
  # Tailwind (the standalone tailwindcss CLI), so this is the exact same build
  # that `nix build .#site` runs locally -- no separate Ruby/Node setup.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      # Pull prebuilt gems and the site closure from the public Cachix cache,
      # and push whatever this run builds back to it. Pulling needs no auth
      # (the cache is public); pushing uses the CACHIX_AUTH_TOKEN secret.
      - name: Set up Cachix
        uses: cachix/cachix-action@v17
        with:
          name: aumitleon
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      # A clean checkout means self.rev resolves to this commit, so the footer's
      # "Improve this page" link and Nix store path point at the exact deployed
      # revision. Most of the toolchain comes from cache.nixos.org; only the
      # gems and the site itself build here.
      - name: Build site
        run: nix build .#site --print-build-logs

      - name: Prepare artifact
        run: |
          mkdir -p _site
          cp -rL result/. _site/
          chmod -R u+w _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Publish the built artifact to GitHub Pages.
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
